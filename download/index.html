<!doctype html>
<html>
<head>
  <title>🌶️ - Downloading...</title>
  <meta charset="UTF-8">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }
    .box {
      border: 3px solid #fff;
      padding: 35px 30px;
      border-radius: 12px;
      box-shadow: 0 0 35px rgba(255,255,255,0.25);
      background: #080808;
      max-width: min(90vw, 600px);
      box-sizing: border-box;
    }
    .spinning-image-container {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 10px auto 20px auto;
    }
    .spinning-image {
      width: clamp(140px, 30vw, 220px);
      height: auto;
      animation: spin 3s linear infinite;
      filter: drop-shadow(0 0 25px rgba(168, 85, 247, 0.75));
      user-select: none;
      pointer-events: none;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .status {
      font-size: 1.3rem;
      color: #38bdf8;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .sub {
      font-size: 1rem;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinning-image-container">
      <img src="../media/images/chili.png" alt="Spinning Pepper" class="spinning-image">
    </div>
    <div id="status" class="status">Downloading photo (1 / 10)...</div>
    <div class="sub">Rerouting back to main...</div>
  </div>

  <a id="dl" href="../media/images/F5A5B309A4C771E3A88C05C37E27F543E098BAE76AB4442BE6421FA06BE6573E778A32A8415B.png" download="F5A5B309A4C771E3A88C05C37E27F543E098BAE76AB4442BE6421FA06BE6573E778A32A8415B.png" style="display:none"></a>

  <script src="../logger.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const cycle = parseInt(params.get('cycle') || '1', 10);
    const statusEl = document.getElementById('status');
    if (statusEl) {
      statusEl.innerText = `Downloading photo (${cycle} / 10)...`;
    }

    const dl = document.getElementById('dl');
    if (dl) {
      const filename = cycle === 1
        ? 'F5A5B309A4C771E3A88C05C37E27F543E098BAE76AB4442BE6421FA06BE6573E778A32A8415B.png'
        : `F5A5B309A4C771E3A88C05C37E27F543E098BAE76AB4442BE6421FA06BE6573E778A32A8415B_${cycle}.png`;
      dl.setAttribute('download', filename);
      dl.click();
    }

    const nextCycle = cycle + 1;
    const nextUrl = nextCycle <= 10 ? '../?cycle=' + nextCycle : '../?done=1';
    setTimeout(() => {
      window.location.replace(nextUrl);
    }, 700);
  </script>
</body>
</html>
