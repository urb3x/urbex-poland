<!doctype html>
<html>
<head>
  <title>🌶️</title>
  <meta charset='UTF-8'>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'avenir next', avenir,
        'helvetica neue', helvetica, ubuntu, roboto, noto, 'segoe ui', arial,
        sans-serif;
      overflow: hidden;
    }
    .hello-message {
      margin: 20px auto;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 90vh;
      z-index: 10;
      position: relative;
    }
    .hello-message h1 {
      margin: 0 0 5px 0;
      font-size: 1.8rem;
    }
    .hello-message h2 {
      margin: 0 0 5px 0;
      font-size: 1.2rem;
      color: #aaa;
    }
    .hello-message h3 {
      margin: 0 0 15px 0;
      font-size: 0.95rem;
      color: #888;
    }
    .spinning-image-container {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 20px auto;
      cursor: pointer;
    }
    .spinning-image {
      width: clamp(160px, 32vw, 300px);
      max-height: 48vh;
      object-fit: contain;
      animation: spin 3s linear infinite;
      filter: drop-shadow(0 0 25px rgba(168, 85, 247, 0.75));
      user-select: none;
      pointer-events: none;
    }
    @keyframes spin {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }
    @media (max-width: 600px), (max-height: 480px) {
      .hello-message {
        min-height: 100vh;
        margin: 0 auto;
        padding: 8px;
        box-sizing: border-box;
      }
      .hello-message h1 {
        font-size: 1.15rem;
        margin: 0 0 2px 0;
      }
      .hello-message h2 {
        font-size: 0.85rem;
        margin: 0 0 2px 0;
      }
      .hello-message h3 {
        font-size: 0.75rem;
        margin: 0 0 6px 0;
      }
      .spinning-image-container {
        margin: 4px auto;
      }
      .spinning-image {
        width: 120px;
        max-height: 120px;
        filter: drop-shadow(0 0 15px rgba(168, 85, 247, 0.75));
      }
    }
    .logout-messages {
      pointer-events: none;
      color: red;
      margin: 40px;
      position: fixed;
      top: 0;
      left: 0;
      text-shadow: 2px 2px #FFF, 4px 4px 10px #000;
      z-index: 1000;
      font-weight: bold;
      font-size: 1.1rem;
    }
    @keyframes blurslowly {
      0% {
        filter: none;
      }
      92% {
        filter: blur(0);
      }
      96% {
        filter: blur(1px);
      }
      100% {
        filter: blur(0);
      }
    }
    body {
      animation-name: blurslowly;
      animation-iteration-count: infinite;
      animation-duration: 15s;
      animation-play-state: running;
    }
  </style>
  <link rel="icon" type="image/png" href="media/images/tox.png">
</head>
<body>

<noscript>Po coś tego JavaScript wyłączył bamboszu!</noscript>

<div class='hello-message'>
  <h2>We no walnij 3 razy w spacje.</h2>
  <h3>(albo kliknij w tekst)</h3>

  <div class='spinning-image-container'>
    <img src='media/images/chili.png' alt='Spinning Pepper' class='spinning-image'>
  </div>
</div>
<div class='logout-messages'></div>

<template>
  <div class='hello-message'>
    <h2>We no walnij 3 razy w spacje.</h2>
    <h3>(albo kliknij w tekst)</h3>

    <div class='spinning-image-container'>
      <img src='media/images/chili.png' alt='Spinning Pepper' class='spinning-image'>
    </div>
  </div>
  <div class='logout-messages'></div>
</template>

<script src='logger.js'></script>
<script src='index.js'></script>

</body>
</html>
